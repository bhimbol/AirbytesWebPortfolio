{% extends 'base.html' %}

{% load static %}

{% block header %}IMAGE PROCESSOR{% endblock %}

{% block content %}

        {% csrf_token %}
        <label for="fileProductDetails">Image Files Upload</label>
        </br>
        <input type="file" id="image_file" name="image_file" accept=".png">

        <button type="submit">Process</button>
    </form>
{% endblock %}
